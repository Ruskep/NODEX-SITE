  <style>
    .mystery-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .mystery-content {
      max-width: 640px;
      text-align: center;
      position: relative;
    }
    .mystery-content__sigil {
      font-size: 72px;
      font-weight: 900;
      color: rgba(217,119,6,0.12);
      letter-spacing: 16px;
      margin-bottom: 8px;
      user-select: none;
      animation: sigilPulse 4s ease-in-out infinite;
    }
    @keyframes sigilPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .mystery-content__line {
      width: 60px;
      height: 1px;
      background: var(--amber);
      margin: 20px auto;
      opacity: 0.3;
    }
    .mystery-content__text {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text-muted);
      white-space: pre-wrap;
      min-height: 80px;
    }
    .mystery-content__empty {
      font-size: 32px;
      letter-spacing: 4px;
      color: var(--text-faint);
      animation: dotFade 2s ease-in-out infinite;
    }
    @keyframes dotFade {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }
    .mystery-back {
      display: inline-block;
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-faint);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 6px 18px;
      border-radius: var(--r-full);
      transition: border-color 0.2s, color 0.2s;
    }
    .mystery-back:hover {
      border-color: var(--amber);
      color: var(--amber);
    }
  </style>
