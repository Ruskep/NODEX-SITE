<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Nodex</title>
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060403;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:#fff}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes drift{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-100vh) scale(0);opacity:0}}
    @keyframes fadeIn{0%{opacity:0;transform:scale(.95) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes breath{0%,100%{opacity:.4}50%{opacity:.7}}
    @keyframes glow{0%,100%{box-shadow:0 0 40px rgba(217,119,6,.06),0 0 80px rgba(217,119,6,.03)}50%{box-shadow:0 0 60px rgba(217,119,6,.12),0 0 120px rgba(217,119,6,.06)}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
    .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(217,119,6,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(217,119,6,.03) 1px,transparent 1px);background-size:60px 60px;opacity:.5}
    .glow1{position:absolute;top:-30%;left:-10%;width:60%;height:80%;background:radial-gradient(ellipse,rgba(217,119,6,.08) 0%,transparent 70%);border-radius:50%}
    .glow2{position:absolute;bottom:-20%;right:-10%;width:50%;height:60%;background:radial-gradient(ellipse,rgba(245,158,11,.05) 0%,transparent 70%);border-radius:50%}
    .scan{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(217,119,6,.12),transparent);animation:scan 4s linear infinite}
    .scan2{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,119,6,.06),transparent);animation:scan 4s linear infinite;animation-delay:2s}
    .particles{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;animation:fadeIn .8s ease-out both}
    .icon-wrap{width:88px;height:88px;border-radius:50%;border:1.5px solid rgba(217,119,6,.12);display:flex;align-items:center;justify-content:center;background:rgba(217,119,6,.02);animation:spin 12s linear infinite,glow 3s ease-in-out infinite;margin-bottom:28px}
    .icon-wrap svg{width:40px;height:40px}
    .label{font-size:10px;text-transform:uppercase;letter-spacing:6px;color:rgba(163,142,122,.35);font-weight:600;margin-bottom:14px}
    .code{font-size:72px;font-weight:900;color:#f59e0b;margin-bottom:4px;letter-spacing:-1px;line-height:1}
    .sub{font-size:13px;color:rgba(163,142,122,.25);margin-bottom:20px;letter-spacing:2px}
    .line{width:32px;height:2px;background:rgba(217,119,6,.15);margin-bottom:24px;border-radius:1px}
    .desc{font-size:14px;color:#7a6a5a;max-width:340px;line-height:1.8;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;background:rgba(217,119,6,.1);color:#d97706;border:1px solid rgba(217,119,6,.15);transition:all .25s}
    .btn:hover{background:rgba(217,119,6,.18);border-color:rgba(217,119,6,.3);transform:translateY(-1px)}
    @keyframes ticker-fade{from{opacity:0}to{opacity:1}}
    @keyframes tick-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
    .ticker-wrap{position:fixed;top:0;left:0;right:0;z-index:50;height:36px;background:#0d0a06;border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;display:flex;align-items:center;animation:ticker-fade 1.2s ease}
    .ticker-wrap::before,.ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:32px;z-index:2;pointer-events:none}
    .ticker-wrap::before{left:0;background:linear-gradient(90deg,#0d0a06,transparent)}
    .ticker-wrap::after{right:0;background:linear-gradient(-90deg,#0d0a06,transparent)}
    .ticker-track{display:flex;white-space:nowrap;will-change:transform;opacity:0;transition:opacity .6s ease}
    .ticker-track--loaded{opacity:1}
    .ticker-inner{display:flex;align-items:center;flex-shrink:0}
    .ticker-item{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:36px;font-size:12px;color:rgba(163,142,122,.7);flex-shrink:0;text-decoration:none;transition:color .15s}
    .ticker-item:hover{color:#f0ece8}
    .ticker-dot{width:5px;height:5px;border-radius:50%;background:#ef4444;animation:tick-pulse 1.5s ease-in-out infinite;flex-shrink:0}
    .ticker-live{font-size:8px;font-weight:800;letter-spacing:1.5px;color:#ef4444}
    .ticker-name{font-weight:700;color:#f0ece8}
    .ticker-status{font-weight:800;color:#22c55e}
    .ticker-status--off{color:rgba(163,142,122,.4);font-weight:700}
    .ticker-sep{color:rgba(163,142,122,.4)}
    .ticker-date{font-size:11px;font-weight:600;color:#d97706}
    .ticker-div{width:3px;height:3px;background:rgba(163,142,122,.4);transform:rotate(45deg)}
  </style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
  <div class="bg">
    <div class="grid"></div>
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="scan"></div>
    <div class="scan2"></div>
  </div>
  <div class="particles" id="particles"></div>
  <div class="content">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <div class="label">Ошибка</div>
    <div class="code">404</div>
    <div class="sub">СТРАНИЦА НЕ НАЙДЕНА</div>
    <div class="line"></div>
    <div class="desc">Возможно, её удалили или вы перешли по неверной ссылке.</div>
    <a href="/" class="btn">← На главную</a>
  </div>
  <script>
    var c=document.getElementById('particles');
    if(c) for(var i=0;i<30;i++){
      var p=document.createElement('div');
      var s=Math.random()*3+1;
      p.style.cssText='position:absolute;left:'+(Math.random()*100)+'%;bottom:-10px;width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+['#d97706','#f59e0b','#fbbf24','rgba(217,119,6,.4)'][Math.floor(Math.random()*4)]+';animation:drift '+(Math.random()*8+6)+'s linear '+(Math.random()*5)+'s infinite';
      c.appendChild(p);
    }
  </script>
  <script src="/js/word-filter.js"></script>
  <script src="/js/goose-game.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
