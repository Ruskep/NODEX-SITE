<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NODEX — Firestore Backup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #fff;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
    }

    #status {
      white-space: pre-wrap;
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>NODEX — резервная копия Firestore</h1>

<p>
  Этот инструмент только читает данные Firestore и сохраняет их в JSON.
  Никакие документы не изменяются и не удаляются.
</p>

<button id="exportBtn">Сделать резервную копию</button>

<div id="status">Готов к экспорту.</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAtULyaH3v7pGZxo7xVUiWYKJRi9sWWQwA",
  authDomain: "nodex-8a787.firebaseapp.com",
  projectId: "nodex-8a787",
  storageBucket: "nodex-8a787.firebasestorage.app",
  messagingSenderId: "120232506956",
  appId: "1:120232506956:web:858f407eb6ae6d265966e9",
  measurementId: "G-P1WCGZK1KW"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const collections = [
  "news",
  "players",
  "seasons",
  "streamers",
  "links",
  "gallery",
  "pages",
  "settings",
  "leaderboard"
];

const status = document.getElementById("status");
const button = document.getElementById("exportBtn");

function convertValue(value) {
  if (value === null || value === undefined) {
    return value;
  }

  if (value instanceof firebase.firestore.Timestamp) {
    return {
      _type: "timestamp",
      value: value.toDate().toISOString()
    };
  }

  if (Array.isArray(value)) {
    return value.map(convertValue);
  }

  if (typeof value === "object") {
    const result = {};

    for (const key in value) {
      result[key] = convertValue(value[key]);
    }

    return result;
  }

  return value;
}

function downloadJSON(filename, data) {
  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

async function exportCollection(name) {
  status.textContent += `\nЧитаю ${name}...`;

  const snapshot = await db.collection(name).get();

  const documents = snapshot.docs.map(doc => ({
    id: doc.id,
    data: convertValue(doc.data())
  }));

  downloadJSON(`${name}.json`, documents);

  status.textContent += ` ✓ ${documents.length} документов`;
}

button.addEventListener("click", async () => {

  button.disabled = true;

  status.textContent =
    "Начинаем резервное копирование...\n" +
    "Firestore будет только ЧИТАТЬ.\n";

  try {

    for (const collection of collections) {
      await exportCollection(collection);

      // Небольшая пауза между коллекциями
      await new Promise(resolve => setTimeout(resolve, 300));
    }

    status.textContent +=
      "\n\n🎉 ГОТОВО!\n" +
      "Все коллекции экспортированы.\n" +
      "Firestore не изменялся.";

  } catch (error) {

    console.error(error);

    status.textContent +=
      "\n\n❌ ОШИБКА:\n" +
      error.message;

    alert(
      "Экспорт остановился с ошибкой:\n\n" +
      error.message
    );

  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
